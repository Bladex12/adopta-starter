<ion-header>
  <ion-toolbar>
    <ion-title>Galería</ion-title>
    <ion-button slot="end" routerLink="/nuevo" color="primary">
      Registrar Perro
    </ion-button>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let perro of mascotas">
        <app-tarjeta-perro [perro]="perro"></app-tarjeta-perro>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
