<ion-card>
  <img [src]="perro.foto" [alt]="perro.nombre" />
  <ion-card-header>
    <ion-card-title>{{ perro.nombre }}</ion-card-title>
    <ion-card-subtitle>{{ perro.raza }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <p><strong>Edad:</strong> {{ perro.edad }}</p>
    <p><strong>Tamaño:</strong> {{ perro.tamano }}</p>
    <ion-badge [color]="perro.adoptado ? 'danger' : 'success'">
      {{ perro.adoptado ? 'Adoptado' : 'Disponible' }}
    </ion-badge>
  </ion-card-content>
  <ion-button fill="clear" (click)="irADetalle()">Ver Detalle</ion-button>
</ion-card>
